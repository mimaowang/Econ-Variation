name: Validate Econ-Variation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py --write-health
      - run: python scripts/build_router.py
      - run: python scripts/check_generated.py
      - run: python -m pytest
      - run: python -m ruff check .
      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- dist

  runtime-bundle:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/runtime_bundle.py --output Econ-Variation-runtime.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Econ-Variation-runtime
          path: Econ-Variation-runtime.zip
